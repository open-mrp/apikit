name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  CGO_ENABLED: 0
  GOTOOLCHAIN: local
  STATICCHECK_VERSION: 0.8.0
  GOSEC_VERSION: 2.28.0

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Go vet
        run: go vet ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v${STATICCHECK_VERSION} ./...

      - name: Gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v${GOSEC_VERSION} -exclude-generated ./...
